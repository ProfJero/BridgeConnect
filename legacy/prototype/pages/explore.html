<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>BridgeConnect - Explore</title>
    <!-- Font Setup -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    
    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAzAOMVoTR5YTrZlzedypz_KqQT-lotI1o",
            authDomain: "bridgeconnect-5b8bd.firebaseapp.com",
            projectId: "bridgeconnect-5b8bd",
            storageBucket: "bridgeconnect-5b8bd.firebasestorage.app",
            messagingSenderId: "231684985335",
            appId: "1:231684985335:web:3f3bfdf7f2708f0ae81ef2",
            measurementId: "G-C8QJH73MC0"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        db.enablePersistence().catch(err => console.warn('Firestore persistence error:', err));
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        brand: { primary: '#0056b3', green: '#28a745', light: '#f0f3ff' },
                        brandGreen: '#28a745'
                    },
                    borderRadius: {
                        'card': '1rem',
                        'custom': '8px',
                        'custom-lg': '16px',
                        'custom-full': '9999px'
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f9f9ff;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* Bottom Nav */
        .bottom-nav-wrapper {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: 94%;
            max-width: 480px;
            z-index: 1000;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        .bottom-nav-wrapper nav { pointer-events: auto; }

        .bottom-nav-glass {
            background: rgba(255, 255, 255, 0.25) !important;
            backdrop-filter: blur(18px) saturate(1.4) !important;
            -webkit-backdrop-filter: blur(18px) saturate(1.4) !important;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            padding: 8px 10px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            position: relative;
        }
        .bottom-nav-glass::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 42px;
            padding: 2px;
            background: repeating-linear-gradient(90deg, rgba(0,86,179,0.08) 0px, rgba(0,86,179,0.08) 6px, transparent 6px, transparent 10px);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0px;
            padding: 4px 8px;
            border-radius: 30px;
            transition: all 0.2s ease;
            position: relative;
            min-width: 44px;
            text-decoration: none;
            color: #9ca3af;
            cursor: pointer;
            background: transparent;
            border: none;
            font-family: inherit;
        }
        .nav-item .nav-icon { font-size: 20px; transition: all 0.2s ease; }
        .nav-item .nav-label { font-size: 9px; font-weight: 600; letter-spacing: 0.2px; margin-top: 1px; }
        .nav-item.active { color: #0056b3; }
        .nav-item.active .nav-icon { transform: translateY(-2px); }
        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 3px;
            border-radius: 4px;
            background: #0056b3;
        }
        .fab-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: -14px;
        }
        .fab-button {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: linear-gradient(135deg, #28a745, #1e7e34);
            border: 3px solid rgba(255,255,255,0.9);
            box-shadow: 0 8px 24px rgba(40,167,69,0.30);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }
        .fab-button:hover { transform: scale(1.06); box-shadow: 0 12px 32px rgba(40,167,69,0.45); }
        .fab-button:active { transform: scale(0.92); }
        .fab-label { font-size: 9px; font-weight: 600; color: #9ca3af; margin-top: 2px; letter-spacing: 0.2px; }

        /* Desktop */
        @media (min-width: 1024px) {
            .mobile-container {
                max-width: 1200px;
                margin: 20px auto;
                border-radius: 32px;
                min-height: 90vh;
                max-height: 950px;
                background: white;
                box-shadow: 0 25px 60px -15px rgba(0,0,0,0.08);
                overflow: hidden;
                display: block;
                padding: 0;
                position: relative;
            }
            .main-content {
                padding: 1.5rem 2.2rem 5rem 2.2rem;
                overflow-y: auto;
                max-height: 90vh;
                background: white;
            }
            .mobile-header { display: none !important; }
            .sidebar-nav { display: none !important; }

            .bottom-nav-wrapper {
                max-width: 560px;
                bottom: 12px;
                width: 92%;
            }
            .bottom-nav-glass {
                padding: 10px 14px;
                border-radius: 48px;
                background: rgba(255, 255, 255, 0.20) !important;
                backdrop-filter: blur(22px) saturate(1.5) !important;
                -webkit-backdrop-filter: blur(22px) saturate(1.5) !important;
                border: 1px solid rgba(255, 255, 255, 0.5);
            }
            .nav-item .nav-icon { font-size: 22px; }
            .nav-item .nav-label { font-size: 10px; }
            .fab-button { width: 60px; height: 60px; font-size: 26px; }
            
            .category-grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 1rem;
            }
            .category-card {
                height: 180px;
            }
        }

        @media (max-width: 1023px) {
            .sidebar-nav { display: none !important; }
            .main-content {
                padding: 0 0 100px 0;
                background: white;
                overflow: visible;
            }
            .mobile-header {
                display: flex !important;
                position: sticky;
                top: 0;
                background: rgba(255,255,255,0.92);
                backdrop-filter: blur(8px);
                z-index: 50;
                padding: 12px 16px;
                border-bottom: 1px solid #f0f0f0;
                justify-content: space-between !important;
                align-items: center !important;
            }
            .bottom-nav-wrapper {
                bottom: 12px;
                width: 96%;
            }
            .bottom-nav-glass {
                background: rgba(255, 255, 255, 0.22) !important;
                backdrop-filter: blur(18px) saturate(1.4) !important;
                -webkit-backdrop-filter: blur(18px) saturate(1.4) !important;
            }
            .category-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 0.75rem;
            }
        }

        @media (max-width: 640px) {
            .category-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.5rem;
            }
            .category-card {
                height: 160px;
                padding: 0.75rem;
            }
            .category-card h3 {
                font-size: 0.9rem;
            }
            .category-card p {
                font-size: 9px;
            }
            .category-card img {
                width: 48px;
                height: 48px;
            }
            .category-card button {
                width: 28px;
                height: 28px;
            }
            .category-card button i {
                font-size: 8px;
            }
        }

        .toast {
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }

        #nav-placeholder { display: block; }

        /* Dropdown styles */
        .dropdown-menu {
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.2s ease;
        }
        .dropdown-menu.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .dropdown-overlay {
            position: fixed;
            inset: 0;
            z-index: 40;
            display: none;
        }
        .dropdown-overlay.active {
            display: block;
        }

        /* Notification badge pulse */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .badge-pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        .category-card {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .category-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }
        .category-card:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<!-- Navigation Placeholder -->
<div id="nav-placeholder"></div>

<!-- Dropdown Overlay -->
<div id="dropdownOverlay" class="dropdown-overlay"></div>

<!-- Main Container -->
<div class="mobile-container">
    <nav class="sidebar-nav" style="display:none;"></nav>

    <div class="main-content">
        <!-- Mobile Header -->
        <header class="mobile-header">
            <div class="flex items-center gap-2">
                <div class="flex flex-col">
                    <div class="flex items-center gap-1 text-brand-primary font-bold text-xl leading-none">
                        <i class="fa-solid fa-users text-brand-primary"></i> BridgeConnect
                    </div>
                    <span class="text-[8px] text-brand-green font-medium">Connecting Communities. Empowering Lives.</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button id="notificationBtn" class="relative text-gray-600 hover:text-brand-primary transition-colors">
                    <i class="fa-regular fa-bell text-xl"></i>
                    <span id="notificationBadge" class="absolute -top-1 -right-1 flex h-4 w-4 items-center justify-center rounded-full bg-red-500 text-[10px] font-bold text-white border-2 border-white badge-pulse">3</span>
                </button>
                <div class="relative">
                    <img id="profileImage" alt="User" class="h-9 w-9 rounded-full object-cover border-2 border-white shadow-sm cursor-pointer" src="https://ui-avatars.com/api/?name=User&background=0052cc&color=fff&size=200"/>
                    <div class="absolute bottom-0 right-0 h-2.5 w-2.5 rounded-full bg-green-500 border border-white"></div>
                </div>
            </div>
        </header>

        <!-- Hero Section -->
        <section class="px-4 pt-5 pb-3">
            <div class="flex justify-between items-start mb-1">
                <h1 class="text-3xl font-bold text-gray-800">Explore</h1>
                <button id="locationBtn" class="flex items-center space-x-2 bg-blue-50 border border-blue-100 rounded-full px-4 py-1.5 text-primary text-sm font-medium shadow-sm">
                    <i class="fa-solid fa-location-dot"></i>
                    <span id="locationText">Kwamankese</span>
                    <i class="fa-solid fa-chevron-down text-[10px]"></i>
                </button>
            </div>
            <p class="text-gray-500 text-sm max-w-[250px]">Discover opportunities, services and resources in your community.</p>
        </section>

        <!-- Location Dropdown -->
        <div id="locationDropdown" class="dropdown-menu absolute z-50 mt-2 w-48 bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden" style="display:none;">
            <div class="py-1">
                <button class="location-option w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors flex items-center gap-2" data-location="kwamankese">
                    <i class="fa-solid fa-location-dot text-brand-primary text-xs"></i> Kwamankese
                </button>
                <button class="location-option w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors flex items-center gap-2" data-location="abura">
                    <i class="fa-solid fa-location-dot text-brand-primary text-xs"></i> Abura
                </button>
                <button class="location-option w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors flex items-center gap-2" data-location="asebu">
                    <i class="fa-solid fa-location-dot text-brand-primary text-xs"></i> Asebu
                </button>
                <button class="location-option w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors flex items-center gap-2" data-location="cape_coast">
                    <i class="fa-solid fa-location-dot text-brand-primary text-xs"></i> Cape Coast
                </button>
                <button class="location-option w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors flex items-center gap-2" data-location="all">
                    <i class="fa-solid fa-globe text-brand-primary text-xs"></i> All Communities
                </button>
            </div>
        </div>

        <!-- Search Bar -->
        <section class="px-4 py-3">
            <div class="relative flex items-center w-full h-12 rounded-custom-lg bg-gray-50 border border-gray-200 shadow-sm focus-within:ring-2 focus-within:ring-brand-primary/20 focus-within:border-brand-primary">
                <div class="pl-4 pr-2 text-gray-400"><i class="fa-solid fa-magnifying-glass"></i></div>
                <input id="searchInput" class="w-full bg-transparent border-none text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-0 py-2" placeholder="Search jobs, businesses, services..." type="text"/>
                <button class="pr-4 pl-2 text-gray-400 hover:text-brand-primary"><i class="fa-solid fa-sliders"></i></button>
            </div>
        </section>

        <!-- Category Grid -->
        <section class="px-4 py-2">
            <div class="category-grid" id="categoryGrid">
                <!-- Categories will be rendered dynamically -->
            </div>
        </section>
    </div>
</div>

<!-- Toast Notification -->
<div id="toast" class="toast"></div>

<!-- JavaScript -->
<script src="../pages/js/explore.js"></script>

</body>
</html>
